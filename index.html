const stack=(v,label=true)=>`<div class="stack" role="img" aria-label="${v.toFixed(1)} grams of gold">${stackArt(v,false,true)}${label?`<div class="count">${v.toFixed(1)}<span class="weight-unit"> g</span></div>`:''}</div>`;

function estimator(id,v,title,person=null){const initial=v===null?3:v;return `<article class="estimate" id="card_${id}" style="--accent:${person===null?'#76916e':COLORS[person]}"><div class="estimate-title">${person===null?'':portrait(person)}<strong>${title}</strong></div><div id="control_${id}" class="stack-editor" data-estimator="${id}" role="slider" tabindex="0" aria-label="${title}, ability in grams per trip" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${initial}" aria-valuetext="${v===null?'Choose an estimate':v.toFixed(1)+' grams'}" aria-disabled="false"><div id="art_${id}">${stackArt(initial,v===null)}</div><div id="handle_${id}" class="handle" style="top:${(225-initial*17)/236*100}%"></div></div><input id="${id}" name="${id}" type="hidden" value="${v===null?'':v}"><div class="adjust"><button type="button" data-step="${id}" data-direction="-1" aria-label="Decrease ${title} by 0.1 grams">−</button><div id="count_${id}" class="count">${v===null?'?':v.toFixed(1)}</div><span class="weight-unit">g</span><button type="button" data-step="${id}" data-direction="1" aria-label="Increase ${title} by 0.1 grams">+</button></div><div id="footer_${id}"></div></article>`;}

function miningAnimation(done){const cards=[...document.querySelectorAll('.scene-card')],reduced=globalThis.matchMedia?.('(prefers-reduced-motion: reduce)').matches;document.querySelectorAll('.faulty-scale').forEach(m=>{m.classList.remove('has-cargo');m.querySelectorAll('.scale-cargo').forEach(c=>{c.style.opacity='';c.style.transform='';c.style.transition='';});});cards.forEach(c=>{c.classList.remove('returned');c.classList.remove('unloaded');c.classList.add('traveling');});$('dig').disabled=true;$('dig-hint').textContent='Heading into the mine…';setTimeout(()=>{$('dig-hint').textContent='Mining…';cards.forEach(c=>c.classList.add('working'));},reduced?0:850);setTimeout(()=>{$('dig-hint').textContent='Bringing the gold back…';cards.forEach(c=>c.classList.remove('working'));},reduced?50:1800);setTimeout(()=>{cards.forEach(c=>{c.classList.remove('traveling');c.classList.add('returned');});done();},reduced?100:2900);}
function scaleGraphic(prefix,center,payload=null){return `<div class="faulty-scale" id="${prefix}-scale"><svg class="scale-machine" viewBox="${payload===null?'0 0 360 300':'0 -125 360 425'}" role="img" aria-label="Faulty weighing scale; reading can be anywhere from one gram below to one gram above the actual weight"><g class="scale-cargo">${(payload==='?'||typeof payload==='number')?goldLumpShape:''}</g><path d="M38 14H322L303 42H57Z" fill="#7a8b7a" stroke="#3d5749" stroke-width="4"/><path d="M165 42H195V72H165Z" fill="#7a8b7a"/><path d="M55 274L73 91Q180 52 287 91L305 274Z" fill="#e0d8b8" stroke="#53694f" stroke-width="5"/><path d="M65 274H295" stroke="#3b5646" stroke-width="13" stroke-linecap="round"/><rect x="100" y="62" width="160" height="28" rx="4" fill="#ecc35d" transform="rotate(-3 180 76)"/><text x="180" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b451e">FAULTY SCALE</text><circle cx="180" cy="151" r="60" fill="#fffbed" stroke="#8e9d85" stroke-width="4"/><path d="M128 121L139 127M150 101L155 114M180 95V109M210 101L205 114M232 121L221 127" stroke="#6b8068" stroke-width="3"/><text x="130" y="153" text-anchor="middle" font-size="14" fill="#4b6351">0</text><text x="180" y="185" text-anchor="middle" font-size="14" fill="#4b6351">6</text><text x="230" y="153" text-anchor="middle" font-size="14" fill="#4b6351">12</text><g id="${prefix}-needle" class="scale-needle"><path d="M180 158L177 110L183 110Z" fill="#b47b26"/><circle cx="180" cy="158" r="6" fill="#53694f"/></g><path class="scale-crack" d="M208 96l-7 18 9 11 -5 17 11 11" fill="none" stroke="#b8c4af" stroke-width="2"/><rect x="121" y="219" width="118" height="37" rx="5" fill="#314d3f"/><text id="${prefix}-display" x="180" y="245" text-anchor="middle" fill="#f3e5a9" font-size="27" font-family="monospace">—</text><text x="228" y="245" text-anchor="middle" fill="#f3e5a9" font-size="12">g</text></svg></div>`;}
function animateWeigh(prefix,center,value,done){
 const machine=$(prefix+'-scale'),needle=$(prefix+'-needle'),display=$(prefix+'-display'),reduced=globalThis.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
 const cargo=machine.querySelector('.scale-cargo'),container=machine.closest('.mine-world,.scene-card'),cart=container?.querySelector('.cart-gold');
 const alreadyLoaded=machine.classList.contains('has-cargo');let placementDelay=alreadyLoaded?100:250;
 machine.classList.remove('weighing');display.textContent='—';
 if(cargo&&cart&&!reduced){
  cargo.style.transition='none';cargo.style.transform='none';cargo.style.opacity='0';
  const from=cart.getBoundingClientRect(),to=cargo.getBoundingClientRect(),svg=machine.querySelector('.scale-machine');
  const ratio=svg.getScreenCTM()?.a||svg.getBoundingClientRect().width/360;
  cargo.style.transform=`translate(${(from.x+from.width/2-to.x-to.width/2)/ratio}px,${(from.y+from.height/2-to.y-to.height/2)/ratio}px)`;
  cargo.style.opacity='1';cargo.getBoundingClientRect();
  cargo.style.transition='transform 700ms ease-in-out';cargo.style.transform='translate(0,0)';
  container.querySelector('.scene-card')?.classList.add('unloaded');if(container.classList.contains('scene-card'))container.classList.add('unloaded');
  placementDelay=760;
 }
 machine.classList.add('has-cargo');
 setTimeout(()=>{
  if($(prefix+'-scale')!==machine)return;
  machine.classList.add('weighing');display.textContent='…';
  const movement=reduced?[0]:[-.6,.8,-.2,.5,0];let index=0;
  const tick=()=>{if($(prefix+'-scale')!==machine)return;const offset=movement[index++];needle.style.transform='rotate('+((Math.min(12,Math.max(0,value+offset))/12)*150-75)+'deg)';if(index<movement.length)setTimeout(tick,210);else{display.textContent=value.toFixed(1);machine.classList.remove('weighing');done();}};
  setTimeout(tick,reduced?100:210);
 },reduced?100:placementDelay);
}
function snapWhole(value){const bounded=Math.min(10,Math.max(0,value)),nearest=Math.round(bounded);return Math.abs(bounded-nearest)<=.18?nearest:bounded;}

 const event=(type,data={})=>events.push({type,...data,elapsed_ms:Math.round(performance.now()-began)});

 function bind(){events=[];began=performance.now();changeHook=()=>{};document.querySelectorAll('[data-estimator]').forEach(control=>{const id=control.dataset.estimator;let dragging=false;const drag=e=>{const box=control.getBoundingClientRect();setEstimate(id,snapWhole((225-(e.clientY-box.top)/box.height*236)/17),'drag');};control.addEventListener('pointerdown',e=>{if(control.getAttribute('aria-disabled')==='true')return;e.preventDefault();control.focus();dragging=true;control.setPointerCapture(e.pointerId);drag(e);});control.addEventListener('pointermove',e=>{if(dragging)drag(e);});control.addEventListener('pointerup',()=>{dragging=false;});control.addEventListener('pointercancel',()=>{dragging=false;});control.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowRight','ArrowDown','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();const current=$(id).value===''?3:+$(id).value;setEstimate(id,e.key==='Home'?0:e.key==='End'?10:current+(['ArrowUp','ArrowRight'].includes(e.key)?.1:-.1),'keyboard');});});document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.step;setEstimate(id,($(id).value===''?3:+$(id).value)+.1*+b.dataset.direction,'step');}));document.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>event('history_toggle',{open:d.open})));}
 const add=(stage,html,finish=()=>{},load=()=>{})=>{const t={stage,html,on_load:()=>{bind();load();},on_finish:d=>{d.stage=stage;d.interactions=[...events];finish(d);records.push(d);}};trials.push(t);return t;};

 add('tutorial_pool',()=>`${header()}<span class="chapter-label">Tutorial</span><h1>The next shift is a paired shift.</h1><p class="lead">Miners work with a partner and bring their gold back in one shared cart.</p><div class="pool-arena" id="pool-arena"><div class="pool-source source-left" id="source-left"><strong>One miner</strong>${portrait(1)}${goldHaul(3.5,false)}</div><div class="pool-source source-right" id="source-right"><strong>Their partner</strong>${portrait(2)}${goldHaul(2,false)}</div><div id="pool-total" class="pool-total" hidden></div><svg class="shared-cart" viewBox="0 0 180 65" aria-hidden="true"><path d="M15 8H165L151 44H29Z" fill="#78846b" stroke="#425744" stroke-width="4"/><path d="M12 8H168" stroke="#425744" stroke-width="6"/><circle cx="45" cy="53" r="10" fill="#425744"/><circle cx="135" cy="53" r="10" fill="#425744"/></svg></div><div id="pool-scale" class="pool-scale" hidden>${scaleGraphic('pooled',5.5,5.5)}</div><div id="pool-equation" class="pool-equation" aria-live="polite">3.5 + 2 = ?</div><div class="center"><button type="button" id="pool" class="primary">Combine their gold</button></div><p id="pool-note" class="small-note center" aria-live="polite">Two contributions go into the same cart.</p>`,()=>{},()=>{let combined=false;allowNext(false);nextLabel('Ready to try →');$('pool').onclick=()=>{if(!combined){$('pool').disabled=true;$('pool-arena').classList.add('combining');event('pool_combine_started');setTimeout(()=>{$('source-left').hidden=true;$('source-right').hidden=true;$('pool-total').hidden=false;$('pool-total').innerHTML=`<div class="landing">${goldHaul(5.5,false)}</div>`;$('pool-equation').textContent='3.5 + 2 = 5.5 grams';$('pool-note').textContent='Together they produce 5.5 grams. The whole cart is weighed once.';$('pool').textContent='Weigh the shared haul';$('pool').disabled=false;combined=true;event('pool_combined',{total:5.5});},globalThis.matchMedia?.('(prefers-reduced-motion: reduce)').matches?0:750);}else{$('pool').disable  w.names.forEach((name,i)=>{let seen=0;add('solo_observations',()=>`${header('Warm-up trips')}<h1>${name}’s turn.</h1><div class="mine-world" id="solo-world"><div class="mining-column"><div class="scene-card">${scene([i])}</div></div><div class="weighing-place">${scaleGraphic('solo',0,'?')}<span id="trip-label" class="trip-label"></span></div></div><div class="solo-trip-action">${mineButton(`Send ${name} into the mine.`)}</div>${crewStrip(w,i,true)}`,d=>{d.person=name;d.observations=w.solo[i];d.revealed=seen;},()=>{seen=0;allowNext(false);nextLabel(`Guess ${name}’s ability →`);$('solo-world').classList.add('arriving');event('miner_arrival',{person:name});$('dig').onclick=()=>{if(seen>=w.solo[i].length)return;$('solo-world').classList.remove('arriving');$('solo-scale').classList.remove('has-cargo');$('solo-display').textContent='—';event('mining_started',{person:name,trip:seen+1});miningAnimation(()=>{const o=w.solo[i][seen];$('dig-hint').textContent='Weighing the haul…';animateWeigh('solo',0,o.displayed,()=>{seen++;$('trip-label').textContent=`Trip ${seen}`;$('trip-history').innerHTML=historyHTML(w.solo[i].slice(0,seen));const done=seen===w.solo[i].length;$('dig').disabled=done;$('dig-hint').textContent=done?`${name} is back at camp.`:'Start the next trip.';event('solo_reveal',{person:name,trip:seen,displayed:o.displayed});allowNext(done);});});};});
 add('solo_estimate',()=>`${header('Back at camp')}<h1>How many grams of gold does ${name}<br>really collect per trip?</h1><p class="lead">Give your best estimate and the lowest and highest values you think are possible.</p><div class="estimate-history"><div class="history">${historyHTML(w.solo[i])}</div></div><div class="bounds">${estimator('low',0,'Lowest possible estimate')}${estimator('solo_guess',null,'Your estimate',i)}${estimator('high',10,'Highest possible estimate')}</div><p class="error center" id="range-error" aria-live="polite"></p>`,d=>{estimates[i]=+d.response.solo_guess;d.person=name;uncertainty.push({person:name,observations:w.solo[i].length,estimate:estimates[i],low:+d.response.low,high:+d.response.high});assessmentRows.push({round:0,person:name,assessment:estimates[i],phase:'solo',locked:false});},()=>{nextLabel(i===w.n?'Begin the paired shift →':`Follow ${w.names[i+1]} →`);const validate=()=>{const chosen=$('solo_guess').value!=='',lo=+$('low').value,hi=+$('high').value,v=+$('solo_guess').value,valid=chosen&&lo<=v&&v<=hi;$('range-error').textContent=chosen&&!valid?'Keep your best guess between the lowest and highest estimates.':'';allowNext(valid);};changeHook=validate;validate();});});
 add('paired_intro',()=>`${header()}<div class="center"><h1>Sandra is the crew’s roaming partner.</h1><p class="lead">Each round, she makes a separate mining trip with each of the other miners. The other miners do not team up with one another.</p><div class="crew partnerships">${w.names.slice(1).map((name,j)=>`<button type="button" class="paper partnership" id="partner_${j}" data-partner="${j}" aria-pressed="false"><div class="row">${portrait(0)}<b>+</b>${portrait(j+1)}</div><strong>Sandra + ${name}</strong></button>`).join('')}</div><p id="partner-story" class="partner-story" aria-live="polite"></p><p>Your estimates carry forward. Adjust any estimate you think should change.</p></div>`,()=>{},()=>{nextLabel('Start mining →');let index=0;const show=j=>{w.names.slice(1).forEach((_,k)=>{$('partner_'+k).classList.toggle('active',j===k);$('partner_'+k).setAttribute('aria-pressed',String(j===k));});$('partner-story').textContent=`Trip ${j+1}: Sandra mines with ${w.names[j+1]}. They return one shared haul.`;event('partnership_highlight',{partner:w.names[j+1]});};w.names.slice(1).forEach((_,j)=>$('partner_'+j).onclick=()=>show(j));show(index);const cycle=()=>{if(!$('partner-story'))return;index++;if(index<w.n){show(index);setTimeout(cycle,1800);}};setTimeout(cycle,1800);});
 for(let round=1;round<=ROUNDS;round++){let offered=[],lockedStart=[],observed=false;add('paired_round',()=>{offered=streak.map((s,i)=>s>=3||locked[i]);lockedStart=[...locked];return `${header()}<div class="round-head"><h1>Round ${round}</h1><div class="dots" aria-label="Round ${round} of 10">${Array.from({length:10},(_,j)=>`<i class="${j<round-1?'past':j===round-1?'current':''}"></i>`).join('')}</div></div><div class="pair-grid ${w.n===3?'three':''}">${w.rounds[round-1].map(o=>`<article class="scene-card pair-scene" style="--pair-accent:${COLORS[o.leaf]}"><div class="scene-label"><strong>Sandra + ${w.names[o.leaf]}</strong></div>${scene([0,o.leaf])}<div id="haul_${o.leaf}" class="pair-weighing">${scaleGraphic('pair'+o.leaf,0,'?')}</div></article>`).join('')}</div><div id="round-tools">${mineButton('Click to send the pairs mining.')}</div><section id="estimate-panel" hidden><h2>Your estimates</h2><p class="muted">How many grams of gold does each miner really produce per trip?</p><div class="estimates centered ${w.n===3?'four':'three'}">${[1,0,...Array.from({length:w.n-1},(_,j)=>j+2)].map(i=>estimator('belief_'+i,estimates[i],w.names[i],i)).join('')}</div><details><summary>Look back at earlier trips</summary>${w.names.map((name,i)=>`<div class="history-row"><strong>${name} · alone</strong><div class="history">${historyHTML(w.solo[i])}</div></div>`).join('')}${w.names.slice(1).map((name,j)=>`<div class="history-row"><strong>Sandra + ${name}</strong><div class="history">${historyHTML(w.rounds.slice(0,round).map(out=>out[j]))}</div></div>`).join('')}</details></section>`;},d=>{const previous=[...estimates];estimates=w.names.map((_,i)=>+d.response['belief_'+i]);w.names.forEach((name,i)=>{const before=!offeredEver[i]&&!offered[i];streak[i]=lastRounds&&estimates[i]===lastRounds[i]?streak[i]+1:1;assessmentRows.push({round,person:name,role:i===0?'hub':'leaf',previous:previous[i],assessment:estimates[i],change:+(estimates[i]-previous[i]).toFixed(3),unchanged:estimates[i]===previous[i],consecutive_identical_submissions:streak[i],suggestion_shown:offered[i],before_first_suggestion:before,locked_at_start:lockedStart[i],locked_at_end:locked[i],input_events:events.filter(e=>e.type==='estimate_change'&&e.field==='belief_'+i).length,rt_ms:d.rt,phase:'paired'});offeredEver[i]=offeredEver[i]||offered[i];});lastRounds=[...estimates];d.round=round;d.outputs=w.rounds[round-1];d.observed=observed;d.assessments=[...estimates];d.suggestions=[...offered];d.locked=[...locked];},()=>{observed=false;allowNext(false);nextLabel(round===10?'Return to camp →':'Next round →');const setHeld=i=>{const id='belief_'+i;$('control_'+id).setAttribute('aria-disabled',String(locked[i]));document.querySelectorAll(`[data-step="${id}"]`).forEach(b=>b.disabled=locked[i]);$('card_'+id).classList.toggle('held',locked[i]);if($('holdstatus_'+i))$('holdstatus_'+i).textContent=locked[i]?'Held — uncheck to adjust.':'You can adjust this estimate anytime.';};w.names.forEach((name,i)=>{const id='belief_'+i;$('footer_'+id).innerHTML=`<div class="muted">Your previous estimate: ${estimates[i].toFixed(1)} g</div>${offered[i]?`<div class="hold">${locked[i]?'':'Same guess for three rounds.'}<label><input type="checkbox" id="hold_${i}" ${locked[i]?'checked':''}> Keep at <span id="holdvalue_${id}">${estimates[i].toFixed(1)}</span> g?</label><span id="holdstatus_${i}"></span></div>`:'<div class="hold"></div>'}`;if(offered[i])$('hold_'+i).addEventListener('change',()=>{locked[i]=$('hold_'+i).checked;setHeld(i);event(locked[i]?'fix':'unfix',{person:name,value:+$(id).value});});setHeld(i);});$('dig').onclick=()=>{event('mining_started',{round,pairs:w.n});miningAnimation(()=>{let remaining=w.n;$('dig-hint').textContent='Weighing the shared carts…';w.rounds[round-1].forEach(o=>animateWeigh('pair'+o.leaf,0,o.displayed,()=>{if(--remaining>0)return;observed=true;$('round-tools').hidden=true;$('estimate-panel').hidden=false;event('pooled_hauls_observed',{round,outputs:w.rounds[round-1].map(o=>o.displayed)});offered.forEach((v,i)=>{if(v)event('suggestion_shown',{person:w.names[i],value:estimates[i],already_locked:locked[i]});});allowNext(true);}));});};});}
 add('debrief',()=>`${header('Back at camp')}<h1>How did you get to know the crew?</h1><div class="paper"><label>How did you decide on your guesses?<textarea name="strategy" required></textarea></label><label>What made you keep a guess or change it?<textarea name="stability" required></textarea></label><label>Anything confusing or difficult to use?<textarea name="usability"></textarea></label></div>`,()=>{},()=>nextLabel('Finish →'));

function download(filename,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function csv(rows){const keys=[...new Set(rows.flatMap(Object.keys))],cell=v=>'"'+String(v===undefined?'':typeof v==='object'?JSON.stringify(v):v).replace(/"/g,'""')+'"';return[keys.map(cell).join(','),...rows.map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n');}
function finish(task,meta){sessionData={metadata:meta,trials:task.records,assessments:task.assessmentRows,uncertainty:task.uncertainty};$('experiment').innerHTML=`<main>${header()}<div class="center"><h1>A good day at the mine.</h1><div class="crew">${meta.names.map((name,i)=>`<div>${portrait(i)}<strong>${name}</strong></div>`).join('')}</div><p>Thanks for getting to know the crew.</p></div><details class="settings" open><summary>Walkthrough results</summary><div class="footer-actions"><button id="json" class="primary">Download full session</button><button id="csv" class="secondary">Download estimates CSV</button><button id="restart" class="secondary">Start again</button></div><p class="muted">Download before closing. Nothing is sent to a research server.</p><details><summary>Design notes</summary><p>2/3 collaborators × 2/8 Sandra solo trips. Others have 4. Common truths, solo prefixes, and paired measurement errors are matched by seed. Abilities stay constant; one independent uniform(−1,1) measurement error applies to each solo or pooled haul. Scales show measured outputs; generic gold lumps never disclose individual true production. History bars summarize weights in grams. Raw and rounded outcomes are saved.</p><p>The pickaxe starts a fixed observation; clicking skill or speed does not affect output. All pairs’ outputs appear together each round. Output bars share a smaller common scale; estimate bars share a larger common scale. History bars use their own common scale. Estimates span 0–10 grams in 0.1-gram steps; dragging within 0.18 of an integer snaps to that integer. Buttons and keys preserve fine increments. Solo guesses start blank. Lower/upper guesses default to 0/10.</p><p>Three identical paired submissions trigger an offer next round, earliest round 4. Baseline does not count. Offers, lock/unlock events, estimate changes and timings are logged. Unchanged estimates alone are not classified as cognitive fixing. Behavior after a suggestion is prompted.</p><p>Usability prototype: no random assignment, consent, incentives, server saving, or main-task feedback. Solo order is fixed. Learned uncertainty and display rounding require updated modeling. Animations respect reduced-motion settings.</p></details></details></main>`;$('json').onclick=()=>download('GoldMiners_'+meta.session_id+'.json',JSON.stringify(sessionData,null,2),'application/json');$('csv').onclick=()=>download('GoldMiners_'+meta.session_id+'.csv',csv(task.assessmentRows.map(r=>({session_id:meta.session_id,n_leaves:meta.n_leaves,Sandra_solo_count:meta.Sandra_solo_count,weight_unit:meta.weight_unit,...r}))),'text/csv');$('restart').onclick=()=>{if(confirm('Download this walkthrough first if you want to keep it. Start again?'))location.reload();};}
async function runOffline(task,meta){let index=0;async function render(t){return new Promise(resolve=>{const started=performance.now();$('experiment').innerHTML=`<main><form id="task-form">${t.html()}<div class="next"><button type="submit" id="task-next">Continue →</button></div></form></main>`;t.on_load();$('task-form').addEventListener('submit',e=>{e.preventDefault();if($('task-next').disabled)return;t.on_finish({stage:t.stage,trial_index:index++,rt:performance.now()-started,response:Object.fromEntries(new FormData(e.target))});resolve();});window.scrollTo(0,0);});}for(const t of task.trials){await render(t);if(t.stage==='comprehension')while(!task.passed()){await render(task.correction);await render(t);}}finish(task,meta);}
function runJsPsych(task,meta){const convert=t=>({type:jsPsychSurveyHtmlForm,html:t.html,button_label:'Continue →',data:{stage:t.stage},on_load:t.on_load,on_finish:t.on_finish});const timeline=[];for(const t of task.trials){if(t.stage==='comprehension')timeline.push({timeline:[convert(t),{timeline:[convert(task.correction)],conditional_function:()=>!task.passed()}],loop_function:()=>!task.passed()});else timeline.push(convert(t));}const jsPsych=initJsPsych({display_element:'experiment',on_finish:()=>finish(task,meta)});jsPsych.data.addProperties(meta);jsPsych.run(timeline);}
function start(){const n=+$('leaves').value,exposure=+$('exposure').value,seed=+$('seed').value;if(!Number.isInteger(seed)||seed<1||seed>2147483647){$('status').textContent='Choose a whole-number seed from 1 to 2147483647.';return;}const w=makeWorld(n,exposure,seed),meta={prototype_version:'gold-3.4',weight_unit:'grams',ability_unit:'grams_per_trip',tutorial_true_weight:3.5,session_id:globalThis.crypto?.randomUUID?.()||String(Date.now()),created_at:new Date().toISOString(),n_leaves:n,Sandra_solo_count:exposure,other_solo_count:4,seed,truth:w.truth,names:w.names,noise:'one uniform(-1,1) scale error per weighing',rounds:ROUNDS,display_decimals:1,estimate_step:.1,drag_snap_threshold:.18,fixing_rule:'3 identical paired submissions; offer next round',tutorial_model:'fixed ability, repeated weighing of same gold',assignment:'researcher_selected',engine:engineReady?'jspsych':'offline_preview'};$('setup').hidden=true;const task=buildTask(w);if(engineReady)runJsPsych(task,meta);else runOffline(task,meta);}
$('start').onclick=start;
